<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RevoU Mini Project</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="https://via.placeholder.com/50" alt="Logo" class="logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="profile.html">Our Profile</a></li>
                <li><a href="#">Portfolio</a></li>
                <li><a href="#">Message Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="welcome-section">
            <h1>Hi <span id="user-name">User</span>, Welcome To Website</h1>
            <p>Ini adalah website latihan pertama</p>
        </section>

        <hr> <section id="headquarters">
            <h2>Our Headquarter</h2>
            <div class="hq-container">
                <div class="hq-item">
                    <div class="circle-icon"></div>
                    <p>Jakarta</p>
                </div>
                <div class="hq-item">
                    <div class="circle-icon"></div>
                    <p>Bandung</p>
                </div>
                <div class="hq-item">
                    <div class="circle-icon"></div>
                    <p>Surabaya</p>
                </div>
            </div>
        </section>

        <hr>

        <section id="message-us">
            <h2>Message Us</h2>
            
            <div class="form-container">
                <form name="message-form" onsubmit="return validateForm()">
                    <div class="form-group">
                        <label for="name">Nama :</label>
                        <input type="text" id="name" placeholder="Nama Anda">
                    </div>

                    <div class="form-group">
                        <label for="birth-date">Tanggal Lahir :</label>
                        <input type="date" id="birth-date">
                    </div>

                    <div class="form-group">
                        <label>Jenis Kelamin :</label>
                        <div class="radio-group">
                            <input type="radio" id="male" name="gender" value="Laki-Laki">
                            <label for="male">Laki-Laki</label>
                            
                            <input type="radio" id="female" name="gender" value="Perempuan">
                            <label for="female">Perempuan</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="message">Pesan :</label>
                        <textarea id="message" placeholder="Pesan Anda"></textarea>
                    </div>

                    <button type="submit" id="submit-btn">Submit</button>
                </form>

                <div class="output-box">
                    <p><strong>Current time :</strong> <span id="current-time"></span></p>
                    <br>
                    <p><strong>Nama :</strong> <span id="sender-name"></span></p>
                    <p><strong>Tanggal Lahir :</strong> <span id="sender-dob"></span></p>
                    <p><strong>Jenis Kelamin :</strong> <span id="sender-gender"></span></p>
                    <p><strong>Pesan :</strong> <span id="sender-message"></span></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Created By RevoU</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
